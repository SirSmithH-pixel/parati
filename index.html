<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e0f7fa; /* Fondo celeste suave */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }
        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 80%;
        }
        h1 { 
            color: #00796b; 
            display: none; 
            font-size: 24px;
            margin: 0;
        }
        button {
            background-color: #009688;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover { 
            background-color: #00796b; 
        }
        .particula {
            position: absolute;
            font-size: 28px;
            animation: flotar 4s linear forwards;
            user-select: none;
            z-index: 1;
        }
        @keyframes flotar {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <button id="btnMagico">Tengo un mensaje para ti ✨</button>
        <!-- Cambia este mensaje por lo que le quieras decir -->
        <h1 id="mensaje">Ten un lindo dia asi como tu¡¡<br>Tu sonrisa es hermosa nunca lo ocultes. 🌻</h1>
    </div>

    <script>
        let btn = document.getElementById('btnMagico');
        let contadorMovimientos = 0;

        btn.addEventListener('click', function() {
            if (contadorMovimientos < 3) {
                // Textos divertidos mientras el botón se escapa
                let frases = ["¡Ups, fallaste!", "¡Casi!", "¡Una más!"];
                this.innerText = frases[contadorMovimientos];

                // Permite que el botón se mueva libremente por toda la pantalla
                this.style.position = 'fixed';
                
                // Calcula una posición aleatoria sin salirse de la ventana
                let maxX = window.innerWidth - this.offsetWidth - 20;
                let maxY = window.innerHeight - this.offsetHeight - 20;
                
                let randomX = Math.max(20, Math.floor(Math.random() * maxX));
                let randomY = Math.max(20, Math.floor(Math.random() * maxY));
                
                this.style.left = randomX + 'px';
                this.style.top = randomY + 'px';
                
                contadorMovimientos++;
            } else {
                // Al cuarto clic, el botón desaparece y muestra el mensaje
                this.style.display = 'none';
                document.getElementById('mensaje').style.display = 'block';
                
                // Animación de estrellas y flores
                let emojis = ['✨', '🌸', '🌻', '🦋'];
                
                setInterval(() => {
                    let particula = document.createElement('div');
                    particula.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                    particula.className = 'particula';
                    particula.style.left = Math.random() * 100 + 'vw';
                    particula.style.animationDuration = (Math.random() * 3 + 3) + 's';
                    document.body.appendChild(particula);
                    
                    setTimeout(() => { particula.remove(); }, 5000);
                }, 300);
            }
        });
    </script>
</body>
</html>
