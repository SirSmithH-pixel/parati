<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti ✨</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fff0f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
        }
        .contenedor {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 80%;
        }
        h1 { 
            color: #ff4d6d; 
            display: none; 
            font-size: 24px;
        }
        button {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        button:hover { 
            background-color: #ff2a55; 
            transform: scale(1.05); 
        }
        .corazon {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            animation: flotar 4s linear forwards;
            user-select: none;
        }
        @keyframes flotar {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <button id="btnMagico">Tengo un mensaje para ti ❤️</button>
        <!-- eres una chica increíble, cualquier hombre seria feliz contigo -->
        <h1 id="mensaje">¡Espero que hoy tengas un día increíble!<br>Sonríe, que te ves genial. ✨</h1>
    </div>

    <script>
        document.getElementById('btnMagico').addEventListener('click', function() {
            this.style.display = 'none';
            document.getElementById('mensaje').style.display = 'block';
            
            // Función para crear la lluvia de corazones
            setInterval(() => {
                let corazon = document.createElement('div');
                corazon.innerHTML = '❤️';
                corazon.className = 'corazon';
                corazon.style.left = Math.random() * 100 + 'vw';
                corazon.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(corazon);
                
                setTimeout(() => { corazon.remove(); }, 5000);
            }, 300);
        });
    </script>
</body>
</html>
